<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Vaipex Playwright Enterprise Test Automation technical architecture</title>
  <desc id="desc">Developers and GitHub Actions invoke a Python control layer that drives parallel Playwright contexts against Vaipex Store and publishes reports and failure evidence to a quality gate.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#152252" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#175ec8"/></marker>
    <style>.ink{fill:#07164f}.muted{fill:#53617f}.eyebrow{font:700 14px Arial,sans-serif;letter-spacing:1.3px}.title{font:800 38px Arial,sans-serif}.cardtitle{font:700 20px Arial,sans-serif}.body{font:16px Arial,sans-serif}.small{font:14px Arial,sans-serif}.line{stroke:#175ec8;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke:#6d42e8;stroke-width:3;fill:none;stroke-dasharray:10 8;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/><circle cx="1450" cy="40" r="235" fill="#f4efff" opacity=".78"/><circle cx="80" cy="850" r="250" fill="#edf6ff" opacity=".9"/>
  <g transform="translate(583 28)"><path d="M0 0h36l24 43-17 29z" fill="#2877ff"/><path d="M72 0h36L66 72H43z" fill="#6d42e8"/><text x="135" y="55" class="ink" style="font:800 38px Arial,sans-serif;letter-spacing:4px">VAIPEX LABS</text></g>
  <text x="800" y="145" text-anchor="middle" class="title ink">TECHNICAL ARCHITECTURE</text>
  <text x="800" y="181" text-anchor="middle" class="body muted">A self-contained Python automation platform with parallel isolation and evidence-backed gates</text>

  <g transform="translate(45 245)" filter="url(#shadow)"><rect width="270" height="460" rx="24" fill="#f7f9ff" stroke="#2877ff" stroke-width="2"/><text x="135" y="42" text-anchor="middle" class="eyebrow ink">EXECUTION ENTRY</text><g transform="translate(24 75)"><rect width="222" height="130" rx="16" fill="#fff" stroke="#d7ddea"/><circle cx="45" cy="50" r="23" fill="#2877ff"/><path d="M31 54h28M38 45l-7 9 7 9" stroke="#fff" stroke-width="4" fill="none"/><text x="80" y="46" class="cardtitle ink">Developer</text><text x="80" y="72" class="small muted">headed • debug</text><text x="22" y="105" class="small muted">two-minute demo</text></g><g transform="translate(24 232)"><rect width="222" height="150" rx="16" fill="#fff" stroke="#d7ddea"/><circle cx="45" cy="50" r="23" fill="#07164f"/><path d="M32 43h26v20H32zM39 36h12" stroke="#fff" stroke-width="3" fill="none"/><text x="80" y="46" class="cardtitle ink">GitHub Actions</text><text x="80" y="72" class="small muted">push • PR • manual</text><text x="22" y="108" class="small muted">immutable actions</text><text x="22" y="130" class="small muted">read-only permissions</text></g></g>

  <path d="M315 475H380" class="line"/>
  <g transform="translate(385 225)" filter="url(#shadow)"><rect width="350" height="500" rx="24" fill="#fff" stroke="#1677ff" stroke-width="2"/><text x="175" y="42" text-anchor="middle" class="eyebrow ink">PYTHON CONTROL LAYER</text><g transform="translate(25 75)"><rect width="300" height="100" rx="16" fill="#edf6ff" stroke="#a8cfff"/><text x="22" y="35" class="cardtitle ink">Validated Configuration</text><text x="22" y="65" class="small muted">environment • timeout • credentials</text></g><g transform="translate(25 195)"><rect width="300" height="100" rx="16" fill="#edf6ff" stroke="#a8cfff"/><text x="22" y="35" class="cardtitle ink">Fixtures &amp; Test Data</text><text x="22" y="65" class="small muted">lifecycle • reset • worker identity</text></g><g transform="translate(25 315)"><rect width="300" height="125" rx="16" fill="#edf6ff" stroke="#a8cfff"/><text x="22" y="35" class="cardtitle ink">Business Journeys</text><text x="22" y="65" class="small muted">page objects • web-first assertions</text><text x="22" y="92" class="small muted">authentication-state reuse</text></g></g>

  <path d="M735 475H800" class="line"/>
  <g transform="translate(805 225)" filter="url(#shadow)"><rect width="350" height="500" rx="24" fill="#f8f5ff" stroke="#6d42e8" stroke-width="2"/><text x="175" y="42" text-anchor="middle" class="eyebrow ink">PLAYWRIGHT RUNTIME</text><g transform="translate(25 75)"><rect width="300" height="115" rx="16" fill="#fff" stroke="#d8cbff"/><text x="22" y="35" class="cardtitle ink">Pytest + xdist</text><text x="22" y="65" class="small muted">parallel worker orchestration</text><text x="22" y="90" class="small muted">one application per worker</text></g><g transform="translate(25 210)"><rect width="300" height="115" rx="16" fill="#fff" stroke="#d8cbff"/><text x="22" y="35" class="cardtitle ink">Chromium Contexts</text><text x="22" y="65" class="small muted">fresh isolation per scenario</text><text x="22" y="90" class="small muted">temporary authenticated state</text></g><g transform="translate(25 345)"><rect width="300" height="95" rx="16" fill="#fff" stroke="#d8cbff"/><text x="22" y="35" class="cardtitle ink">Artifact Recorder</text><text x="22" y="65" class="small muted">trace • screenshot • video</text></g></g>

  <path d="M1155 380H1220" class="line"/><path d="M1155 595H1220" class="line"/>
  <g transform="translate(1225 235)" filter="url(#shadow)"><rect width="330" height="270" rx="24" fill="#f7f9ff" stroke="#2877ff" stroke-width="2"/><circle cx="55" cy="60" r="30" fill="#2877ff"/><path d="M37 48h36v25H37zM46 80h18" stroke="#fff" stroke-width="4" fill="none"/><text x="105" y="54" class="eyebrow ink">SYSTEM UNDER TEST</text><text x="105" y="87" class="cardtitle ink">Vaipex Store</text><text x="30" y="140" class="body muted">FastAPI reference service</text><text x="30" y="172" class="body muted">Login, catalog, cart, checkout</text><text x="30" y="204" class="body muted">Health, reset, and catalog APIs</text><text x="30" y="236" class="small muted">deterministic and self-contained</text></g>
  <g transform="translate(1225 535)" filter="url(#shadow)"><rect width="330" height="190" rx="24" fill="#f4fbf8" stroke="#16a085" stroke-width="2"/><circle cx="55" cy="58" r="30" fill="#16a085"/><path d="M40 58l10 10 21-25" stroke="#fff" stroke-width="5" fill="none"/><text x="105" y="52" class="eyebrow ink">QUALITY DECISION</text><text x="105" y="85" class="cardtitle ink">Reports &amp; Gate</text><text x="30" y="132" class="body muted">HTML • JUnit • CI artifacts</text><text x="30" y="162" class="body muted">pass, diagnose, or block</text></g>

  <rect x="60" y="790" width="1480" height="60" rx="18" fill="#f7f9ff" stroke="#c9d6f5"/><text x="95" y="826" class="small ink"><tspan font-weight="700">QUALITY CONTRACT:</tspan><tspan x="260">locked toolchain + fast checks + isolated browser journeys + actionable evidence + stable delivery gate</tspan></text>
</svg>
