[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "vaipex-playwright-foundation"
version = "0.1.0"
description = "A deterministic reference application and Playwright automation foundation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "Vaipex Labs", email = "vaipex.labs@gmail.com" }]
dependencies = [
  "fastapi==0.162.0",
  "itsdangerous==2.2.0",
  "jinja2==3.1.6",
  "python-multipart==0.0.32",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
test = [
  "httpx2==2.16.0",
  "playwright==1.64.1",
  "pytest==9.2.0",
  "pytest-html==4.2.0",
  "pytest-playwright==0.10.0",
  "pytest-xdist==3.8.0",
  "ruff==0.17.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vaipex_store = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
markers = [
  "e2e: browser-based end-to-end tests",
  "evidence_demo: intentionally failing test used to prove evidence capture",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
